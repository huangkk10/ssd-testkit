tool_name: python_installer
choco_package_id: python-installer
tool_type: installer

versions:
  - version: "3.10.11"
    source_dir: "bin/installers/python_installer/3.10.11"
    installer_file: "python-3.10.11-amd64.exe"
    default: true

install_dir: "C:\\Program Files\\Python310"
binaries:
  - "python.exe"
install_args: "/quiet InstallAllUsers=1 PrependPath=1 Include_test=0 TargetDir=C:\\Program Files\\Python310"
uninstall_args: "/quiet /uninstall"
notes: >
  Python 3.10.11 x64 offline installer package for local deployment and later Nexus/NAS publication.