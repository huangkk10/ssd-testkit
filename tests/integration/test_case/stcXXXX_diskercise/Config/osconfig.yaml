# osconfig.yaml — stcXXXX_diskercise
# SUT 準備清單：停用會干擾 Diskercise I/O 壓測的排程工作並切換電源計畫

# MemoryDiagnostic：停用 RunFullMemoryDiagnostic 排程，避免測試中途觸發記憶體診斷
disable_memory_diagnostic_tasks: true

# McAfee：停用 McAfee 排程工作（若未安裝則自動 no-op）
disable_mcafee_tasks: true

# Power Plan：高效能模式，確保磁碟 I/O 不受節能政策影響
power_plan: "high performance"

# 自動登入：重開機後自動以 Administrator 帳號登入，讓 pytest 可以繼續執行
# 密碼由環境變數 SSD_TESTKIT_AUTO_LOGIN_PASSWORD 提供（不寫入此檔）
enable_auto_admin_logon: true
auto_login_password: ""
