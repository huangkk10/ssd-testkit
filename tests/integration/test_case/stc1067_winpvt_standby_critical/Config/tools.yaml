# tools.yaml — stc1067_winpvt_standby_critical
#
# phase: pre_runcard — 在 setup_test_class 中、RunCard 初始化前安裝
# phase: test        — 在 test_02_install_tools 中安裝（預設，可省略）

tools:
  - id: winpvt
    reinstall: false
    phase: test           # 在 test_02_install_tools 安裝，避免 setup 時重複安裝

  # smiwintools (含 SmartCheck.bat) — SmartCheck SSD health pre-check 用
  - id: smiwintools
    reinstall: false
    env:
      SMIWINTOOLS_PATH: "C:\\tools\\SmiWinTools"  # SmartCheckController auto-resolution 用

  # - id: cdi
  #   reinstall: false
