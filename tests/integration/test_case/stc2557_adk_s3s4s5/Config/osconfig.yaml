# osconfig.yaml — stc2557_adk_s3s4s5
# SUT 準備清單：停用 Task Scheduler 中會干擾測試的工作
#
# 欄位說明請參考 lib/testtool/osconfig/config.py OsConfigProfile
# 未列出的欄位維持預設值 (False / "")

# SystemRestore：停用 C:\ 的系統還原
# （透過 Disable-ComputerRestore + registry DisableSR=1）
disable_system_restore: true

# MemoryDiagnostic：停用 RunFullMemoryDiagnostic 排程工作
# Task path: \Microsoft\Windows\MemoryDiagnostic\RunFullMemoryDiagnostic
disable_memory_diagnostic_tasks: true

# McAfee：停用 McAfee 排程工作（若未安裝則自動 no-op）
# Tasks: \McAfee\McAfee Auto Maintenance Task Agent
#        \McAfee\DAD.WPS.Execute.Updates
disable_mcafee_tasks: true

# Fast Startup：明確啟用 HiberbootEnabled=1，確保 BPFS assessment 的 ETW AutoLogger 正常初始化
# 若前次測試遺留 HiberbootEnabled=0 而未還原，此欄位保證在 step 3 正確設回 1。
# Registry: HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power
#           HiberbootEnabled = 1
enable_fast_startup: true

# Hibernation：確保 powercfg /h on，BPFS/S4/S5 assessment 需要 hiberfil.sys
# apply: powercfg /hibernate on
# revert: powercfg /hibernate off
enable_hibernation: true

# Power Plan：ADK 要求 Balanced 才能取得準確量測結果
# apply: 切換至 Balanced；revert: 還原原始 plan
power_plan: "balanced"

# 自動登入：開機後自動以指定帳號登入（僅限 lab 機器；密碼儲存為明文）
# Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
#           AutoAdminLogon = "1"
#
# username：不填 → test_03 自動使用目前登入的使用者（getpass.getuser()）
# password：不填 → 必須設定環境變數 SSD_TESTKIT_AUTO_LOGIN_PASSWORD；否則 test_03 直接 fail
# domain  ：不填 → 預設 "." (本機帳號)
#
# ⚠ 必須為 true：S4 hibernate、S5 cold reboot 後需自動登入，
#   startup BAT 才能觸發並讓 pytest 繼續執行。
#   若 OS 本身沒有預設 auto-login（例如全新安裝的 24H2）且此欄位設為 false，
#   reboot 後會停在鎖定畫面，看起來像「機器掛掉」。
#   25H2 機器若事先已手動設定 auto-login，即使此欄位為 false 也不會壞，
#   但建議永遠設為 true 確保行為一致。
enable_auto_admin_logon: false
revert_auto_admin_logon: true         # 測試結束後保留 auto-logon 設定，不還原
# auto_login_username: "Administrator"  # 若需強制指定帳號名稱請取消此行註解
auto_login_password: ""                # ⚠ 必須填入登入密碼，或設定 SSD_TESTKIT_AUTO_LOGIN_PASSWORD 環境變數
# auto_login_domain: "."               # 本機帳號留空或用 "."

# Test Signing：關閉 bcdedit testsigning，確保 kernel 驅動程式簽章驗證正常
# Command: bcdedit /set testsigning off
disable_test_signing: true

# UAC：停用使用者帳戶控制（EnableLUA=0），避免提權提示干擾自動化測試
# Registry: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Policies\System
#           EnableLUA = 0
disable_uac: true

# ──────────────────────────────────────────────────────────────────────────────
# build_overrides：依 Windows build 號碼套用額外設定（需 profile_loader 支援）
#
# 規則：
#   - 每個 key 是「最低 build 號碼」(inclusive)
#   - 所有 key <= current_build 的 entry 都會套用（由小到大疊加，大的 key 覆蓋小的）
#   - 值會覆蓋 base 設定，不符合的 entry 完全忽略
#
# 為什麼 24H2 需要 enable_boot_perf_autologger 但 25H2 不需要：
#   Win11 24H2 (build 26100) ETW AutoLogger Start 預設值 = 0
#   → WAC BPFS assessment 失敗 (error 0xC0040477)
#   Win11 25H2+ (build > 26100) 預設值已改為 1，不需要此設定
# ──────────────────────────────────────────────────────────────────────────────
build_overrides:
  26100:    # Win11 24H2+ (build >= 26100)：ETW AutoLogger Start 預設為 0，需強制設為 1
    # Registry: HKLM\SYSTEM\CurrentControlSet\Control\WMI\Autologger\
    #           Microsoft-Windows-Boot-Performance-Diagnostics  Start = 1
    enable_boot_perf_autologger: true
